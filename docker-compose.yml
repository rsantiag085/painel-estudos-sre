services:
  painel-estudos-sre:
    container_name: sre-tracker
    image: rsantiag085/painel-estudos-sre:v3.3
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "v3.3"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=v3.3
      - SCALE_ANCHOR_DATE=2026-01-01
      - DATABASE_URL=sqlite:///./sre_tracker.db
    # Opção de persistência:
    # 1. Bind mount direto do arquivo SQLite no host (certifique-se de que o arquivo existe antes do primeiro up: `touch sre_tracker.db`)
    volumes:
      - ./sre_tracker.db:/app/sre_tracker.db
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/settings')\" || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
