services:
  painel-estudos-sre:
    container_name: sre-tracker
    # Para publicar sua própria imagem, substitua pelo seu usuário:
    # image: <seu-usuario-dockerhub>/painel-estudos-sre:v3.3
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "v3.3"
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_VERSION=v3.3
      # Configure sua data âncora da escala 12x36 no arquivo .env (não commitar).
      # Exemplo: SCALE_ANCHOR_DATE=2030-01-01 (substitua por uma data de FOLGA conhecida).
      - SCALE_ANCHOR_DATE=${SCALE_ANCHOR_DATE:-2030-01-01}
      - DATABASE_URL=sqlite:///./sre_tracker.db
    # Bind mount: garante que o banco de dados persiste no host.
    # Execute `touch sre_tracker.db` antes do primeiro `docker compose up`.
    volumes:
      - ./sre_tracker.db:/app/sre_tracker.db
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/settings')\" || exit 1" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
