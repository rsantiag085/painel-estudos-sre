<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SRE Tracker — agenda dinâmica de estudos para escala 12x36">
  <title>SRE Tracker — Agenda dinâmica</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
</head>
<body>
  <aside id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">SRE <span>Tracker</span> <span class="version">{{ APP_VERSION }}</span></div>
      <div class="subtitle">Trilha personalizada<br>Operações → SRE</div>
    </div>

    <nav class="sidebar-nav" aria-label="Navegação principal">
      <button class="nav-item active" data-view="today" aria-current="page"><span class="icon">⬡</span> Hoje</button>
      <button class="nav-item" data-view="queue"><span class="icon">≡</span> Fila</button>
      <button class="nav-item" data-view="courses"><span class="icon">▤</span> Cursos</button>
      <button class="nav-item" data-view="roadmap"><span class="icon">◇</span> Roadmap</button>
      <button class="nav-item" data-view="projects"><span class="icon">⌘</span> Projetos</button>
      <button class="nav-item" data-view="achievements"><span class="icon">🏅</span> Conquistas</button>
      <button class="nav-item" data-view="aws"><span class="icon">☁</span> AWS re/Start</button>
      <button class="nav-item" data-view="google"><span class="icon">G</span> Google Cloud</button>
      <button class="nav-item" data-view="history"><span class="icon">↺</span> Histórico</button>
      <button class="nav-item" data-view="stats"><span class="icon">▥</span> Estatísticas</button>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-day-card">
        <span class="sidebar-day-icon">◉</span>
        <div>
          <span class="sidebar-day-label">Hoje</span>
          <strong id="sidebar-day-type">—</strong>
          <small id="sidebar-date">carregando...</small>
        </div>
      </div>
      <div class="sidebar-prog-card">
        <div class="sidebar-prog-header">
          <span class="sidebar-prog-label">Progresso</span>
          <span class="sidebar-prog-pct" id="sidebar-pct-value">0%</span>
        </div>
        <div class="sidebar-mini-bar"><div class="sidebar-mini-fill" id="sidebar-mini-fill"></div></div>
        <div class="sidebar-prog-meta">
          <span id="sidebar-done-count">0 concluídas</span>
          <span id="sidebar-hours">0h</span>
        </div>
      </div>
    </div>
  </aside>

  <main id="main">
    <header id="view-header">
      <div>
        <h1 id="view-title">⬡ Hoje</h1>
        <div class="header-meta" id="view-meta">Sua agenda sustentável de estudos</div>
      </div>
      <button class="btn refresh-btn" id="refresh-button" type="button">↻ ATUALIZAR</button>
    </header>
    <div id="view-content" aria-live="polite">
      <div class="loading"><div class="spinner"></div>Carregando agenda...</div>
    </div>
  </main>

  <div class="modal-overlay" id="note-modal" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <div class="modal">
      <div class="modal-title" id="note-title">Adicionar nota</div>
      <div class="modal-sub" id="note-activity-name"></div>
      <div class="modal-note">
        <label for="note-text">Nota da atividade</label>
        <textarea id="note-text" placeholder="Dificuldades, comandos, pontos para revisar..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn" id="note-cancel" type="button">CANCELAR</button>
        <button class="btn btn-primary" id="note-save" type="button">SALVAR NOTA</button>
      </div>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <script src="/static/app.js?v=10"></script>
</body>
</html>
